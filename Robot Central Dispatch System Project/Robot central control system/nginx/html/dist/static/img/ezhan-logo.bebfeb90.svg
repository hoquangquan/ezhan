<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 背景 -->
  <rect width="100" height="100" rx="10" fill="#1E88E5"/>
  
  <!-- 机器人头部 -->
  <rect x="20" y="20" width="60" height="40" rx="5" fill="white"/>
  
  <!-- 天线 -->
  <line x1="50" y1="15" x2="50" y2="20" stroke="white" stroke-width="2"/>
  <circle cx="50" cy="13" r="2" fill="#FFC107"/>
  
  <!-- 眼睛 -->
  <circle cx="35" cy="35" r="5" fill="#1E88E5"/>
  <circle cx="65" cy="35" r="5" fill="#1E88E5"/>
  
  <!-- 嘴巴 -->
  <rect x="35" y="50" width="30" height="5" rx="2" fill="#1E88E5"/>
  
  <!-- 文字 -->
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Ezhan</text>
</svg>